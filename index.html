<!DOCTYPE html><html><head>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Tail Lift Remote</title>
<style>
 body{font-family:sans-serif;background:#111;color:#eee;margin:0;padding:12px;user-select:none;-webkit-user-select:none;touch-action:none}
 #c{width:100%;padding:14px;font-size:1.1em;border:0;border-radius:12px;background:#2980b9;color:#fff}
 #s{text-align:center;padding:8px}
 .b{display:block;width:100%;height:20vh;margin:8px 0;font-size:1.8em;border:0;border-radius:18px;background:#444;color:#fff;touch-action:none}
 .b.live{outline:6px solid #fff}
</style></head><body>
<button id="c">Connect to TailLift</button>
<div id="s">Not connected</div>
 <button class="b" data-n="2" style="background:#2980b9">Swing Up ↺</button>
<button class="b" data-n="1" style="background:#27ae60">Up ⇪</button>


<button class="b" data-n="4" style="background:#c0392b">Down ⇩</button>
 <button class="b" data-n="3" style="background:#e1a100;color:#000">Swing Down ↻</button>
<script>
const SVC='6e400001-b5a3-f393-e0a9-e50e24dcca9e', CH='6e400002-b5a3-f393-e0a9-e50e24dcca9e';
let ch=null, cur=0, timer=null; const st=document.getElementById('s');
document.getElementById('c').onclick=async()=>{
  try{
    const d=await navigator.bluetooth.requestDevice({filters:[{name:'TailLift'}],optionalServices:[SVC]});
    d.addEventListener('gattserverdisconnected',()=>{ch=null;stop();st.textContent='Disconnected';});
    const sv=await (await d.gatt.connect()).getPrimaryService(SVC);
    ch=await sv.getCharacteristic(CH); st.textContent='Connected - hold a button';
  }catch(e){st.textContent='Error: '+e.message;}
};
function send(n){ if(!ch)return; (ch.writeValueWithoutResponse?ch.writeValueWithoutResponse(new Uint8Array([n])):ch.writeValue(new Uint8Array([n]))).catch(()=>{}); }
function start(n,el){ if(!ch||cur)return; cur=n; el.classList.add('live'); st.textContent='RUNNING '+n; send(n); timer=setInterval(()=>send(cur),100); }
function stop(){ if(timer)clearInterval(timer); timer=null; if(cur){send(0);send(0);} cur=0;
  document.querySelectorAll('.b').forEach(b=>b.classList.remove('live')); if(ch)st.textContent='Connected - hold a button'; }
document.querySelectorAll('.b').forEach(b=>{
  b.addEventListener('pointerdown',e=>{b.setPointerCapture(e.pointerId);start(+b.dataset.n,b);});
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,stop));
  b.addEventListener('contextmenu',e=>e.preventDefault());
});
document.addEventListener('visibilitychange',stop); window.addEventListener('blur',stop);
</script></body></html>
